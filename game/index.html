<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle Line — Rush Hour Kitchen</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1d12; }
  #game { position: fixed; inset: 0; margin: auto; display: block; touch-action: none; background: #c98d5f; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sizzle Line: a rush-hour cooking game. Take tickets, grill patties, chop vegetables, plate dishes and serve them before the timer runs out."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
<!-- Sizzle Line — Rush Hour Kitchen: a complete cooking game in plain static files. -->
</body>
</html>
